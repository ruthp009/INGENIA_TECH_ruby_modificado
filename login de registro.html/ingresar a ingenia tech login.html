<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registro</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container" id="container">

    <!-- SECCION LOGIN -->
    <div class="form-container login-container">
        <form>
            <h2>Login</h2>

            <input type="text" placeholder="Usuario" required>

            <div class="password-box">
                <input type="password" id="loginPass" placeholder="Contraseña" required>
                <span onclick="togglePassword('loginPass')">😉</span>
            </div>

            <button type="button" onclick="iniciarSesion()">Login</button>

            <p>¿No tienes cuenta?
                <a href="#" onclick="mostrarRegistro()">Registrarse</a>
            </p>
        </form>
    </div>

    <!-- SECCION REGISTRO -->
    <div class="form-container register-container">
        <form>
            <h2>Sign Up</h2>

            <input type="text" id="nombre" placeholder="Usuario" required>
            <input type="email" id="correo" placeholder="Correo electrónico" required>

            <div class="password-box">
                <input type="password" id="registerPass" placeholder="Contraseña" required>
                <span onclick="togglePassword('registerPass')">😒</span>
            </div>

            <button type="button" onclick="registrarUsuario()">Registrar</button>

            <p>¿Ya tienes cuenta?
                <a href="#" onclick="mostrarLogin()">Login</a>
            </p>
        </form>
    </div>

    <!-- PANEL DECORATIVO -->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>WELCOME!</h1>
            </div>

            <div class="overlay-panel overlay-right">
                <h1>SEAIS BIENVENIDO A INGENIA TECH</h1>
                <p>Disfruta tu estancia</p>
            </div>
        </div>
    </div>

</div>

<script src="script de la pagina.js"></script>
</body>
</html>
